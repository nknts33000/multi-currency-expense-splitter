spring.application.name=multi-currency-expense-splitter

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# A fixed name, so you know what to type in the console's login form
spring.datasource.url=jdbc:h2:mem:splitter;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=sa

spring.security.user.name=admin
spring.security.user.password=admin